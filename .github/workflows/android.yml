name: NewFag Android

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # v* etiketlerinde GitHub Release olusturmak icin

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NEWFAG_KEYSTORE_PASSWORD: ${{ secrets.NEWFAG_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      # - name: Get JRE17
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-new
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre17-pojav
      #
      # - name: Get JRE21
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-21
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre21-pojav
      #
      # - name: Get JRE25
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-25
      #     workflow_conclusion: completed
      #     repo: FCL-Team/Android-OpenJDK-Build
      #     branch: Build_JRE_25
      #     name: jre25-multiarch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      # NewFag imza anahtari (GitHub > Settings > Secrets: NEWFAG_KEYSTORE_B64 + NEWFAG_KEYSTORE_PASSWORD).
      # Yoksa APK debug anahtariyla imzalanir (test icin yeterli, guncellemeler icin degil).
      - name: NewFag imza anahtari
        env:
          NEWFAG_KEYSTORE_B64: ${{ secrets.NEWFAG_KEYSTORE_B64 }}
        run: |
          if [ -n "$NEWFAG_KEYSTORE_B64" ]; then
            echo "$NEWFAG_KEYSTORE_B64" | base64 -d > app_pojavlauncher/newfag.jks
            echo "NewFag anahtariyla imzalanacak."
          else
            echo "::warning::NEWFAG_KEYSTORE_B64 yok, debug anahtariyla imzalanacak."
          fi

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Release .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-release.apk > out/app-release.md5

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NewFag-Android-debug
          path: out/app-debug.*

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NewFag-Android
          path: out/app-release.*

      # v* etiketi gonderilince APK sabit adla yayinlanir:
      # https://github.com/slmbenkahn/newfag-android/releases/latest/download/NewFag-Android.apk
      - name: Release icin APK hazirla
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp out/app-release.apk out/NewFag-Android.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NewFag Android ${{ github.ref_name }}
          files: out/NewFag-Android.apk
          make_latest: true
          body: |
            **NewFag Launcher – Android** (Minecraft Java Edition, Fabric + NewFag paketi)

            İndir: **NewFag-Android.apk** (aşağıda). Kurarken "bilinmeyen kaynaklara izin ver" demen gerekir.
            İlk açılışta NewFag profili ve modlar otomatik kurulur; Oyna'ya basınca doğrudan play.newfag.net'e bağlanır.

            Amethyst (PojavLauncher) tabanlıdır, LGPL-3.0.

